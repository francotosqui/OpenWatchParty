[package]
name = "session-server-fuzz"
version = "0.6.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "test-util"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
warp = { version = "0.4", features = ["server", "websocket", "test"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = { version = "0.3", default-features = false }
uuid = { version = "1", features = ["v4"] }
env_logger = "0.11"
log = "0.4"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
base64 = "0.23"
ipnet = "2"

[[bin]]
name = "inbound_ws"
path = "fuzz_targets/inbound_ws.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
