name: Server Hardening

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    name: Inbound WebSocket Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RUSTFLAGS: ''
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly-2026-10-01
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.1
      - name: Verify fuzz dependency alignment
        run: python3 infra/scripts/verify-fuzz-dependencies.py
      - name: Fetch locked fuzz dependencies
        run: cargo fetch --locked --manifest-path src/server/fuzz/Cargo.toml
      - name: Replay corpus and server regression tests
        run: cargo +nightly-2026-10-01 test --locked --manifest-path src/server/fuzz/Cargo.toml --lib
      - name: Fuzz the real WebSocket ingress
        working-directory: src/server
        env:
          CARGO_NET_OFFLINE: 'true'
          BUDGET: ${{ github.event_name == 'schedule' && '300' || '30' }}
        run: cargo +nightly-2026-10-01 fuzz run inbound_ws -- -max_total_time="$BUDGET" -max_len=65537 -rss_limit_mb=1024 -timeout=5
      - name: Preserve crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inbound-ws-reproducers
          path: src/server/fuzz/artifacts/
          if-no-files-found: ignore

  load-smoke:
    name: Session Load Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test load report helpers
        run: node --test infra/scripts/tests/load-session-server.test.mjs
      - name: Build disposable server
        run: docker build -f infra/docker/server.Dockerfile -t openwatchparty/session-server:test src/server
      - name: Start empty test server
        run: |
          docker run -d --name owp-load --cpus 2 --memory 512m -p 127.0.0.1:19000:3000 \
            -e ALLOW_INSECURE_NO_AUTH=true -e ALLOWED_ORIGINS='*' -e LOG_LEVEL=warn \
            -e MAX_CONNECTIONS=256 -e MAX_CONNECTIONS_PER_IP=256 openwatchparty/session-server:test
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:19000/ready && exit 0
            sleep 1
          done
          exit 1
      - name: Exercise 10 rooms with 5 clients each
        run: node infra/scripts/load-session-server.mjs --rooms 10 --clients 5 --seconds 10 --container owp-load
      - name: Stop test server
        if: always()
        run: docker rm -f owp-load || true
